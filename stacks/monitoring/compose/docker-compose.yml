# docker-compose.yml
# Monitoring stack for Raspberry Pi (ARM64) with IaC + basic hardening
# - Exposes ONLY Grafana by default
# - Alertmanager/VictoriaMetrics UIs are kept localhost-bound (enable LAN only if you really need it)

name: ${COMPOSE_PROJECT_NAME:-homelab-home-prod-mon}

services:

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    # nobody:nogroup, explicit: the rendered config is 0640 root:nogroup (F26).
    user: "65534:65534"
    networks: [monitoring]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - /srv/data/stacks/monitoring/alertmanager:/alertmanager
      # Config + templates come from the single volume prepared by the renderer
      - /srv/data/stacks/monitoring/alertmanager-config:/etc/alertmanager:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    depends_on:
      alertmanager-config-render:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      - "homelab.config-hash=${MONITORING_CONFIG_HASH:-unset}"
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  # One-shot renderer: ../alertmanager/render-config.sh renders alertmanager.yml from the
  # template (escaped values, amtool check-config) and copies templates into the same dir.
  # Same image as alertmanager: it already ships sh, awk and amtool, so nothing is installed
  # at runtime and the renderer needs no network (F8, F36).
  alertmanager-config-render:
    image: prom/alertmanager:v0.34.0
    restart: "no"
    # uid 0 owns the output; the supplementary alertmanager group lets the owner chgrp it
    # without CAP_CHOWN (F26). Primary group 0: "0:65534" broke `apk add` in R1.1.
    user: "0:0"
    group_add: ["65534"]
    network_mode: none

    # Compose interpolation must not hard-fail if SMTP isn't configured yet.
    # Strict validation happens in render-config.sh only when ALERT_EMAIL_ENABLED=1.
    environment:
      ALERT_EMAIL_ENABLED: ${ALERT_EMAIL_ENABLED:-0}

      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_AUTH_USERNAME: ${ALERT_SMTP_AUTH_USERNAME:-}
      ALERT_SMTP_AUTH_PASSWORD: ${ALERT_SMTP_AUTH_PASSWORD:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-}

    volumes:
      - /srv/data/stacks/monitoring/alertmanager-config:/out
      - ../alertmanager/alertmanager.yml.tmpl:/in/alertmanager.yml.tmpl:ro
      - ../alertmanager/templates:/in/templates:ro
      - ../alertmanager/render-config.sh:/in/render-config.sh:ro

    entrypoint: ["/bin/sh", "/in/render-config.sh"]

    labels:
      - "homelab.config-hash=${MONITORING_CONFIG_HASH:-unset}"
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    # Nothing is installed any more; only the /out bind mount is written, no /tmp needed.
    read_only: true
    # The image declares VOLUME /alertmanager; left uncovered, Docker adds an anonymous volume
    # (ADR-0008, postdeploy test_56). A tmpfs covers it; the renderer never writes there.
    tmpfs:
      - /alertmanager

  # --- New: VictoriaMetrics single-node TSDB ---
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0
    restart: unless-stopped
    networks: [monitoring]
    # Localhost-bound UI/API for debugging; remove or move behind Traefik later.
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - /srv/data/stacks/monitoring/victoriametrics:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1:8428/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4G
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  # --- New: scrape agent -> remote_write into VictoriaMetrics ---
  vmagent:
    image: victoriametrics/vmagent:v1.152.0
    restart: unless-stopped
    networks: [monitoring]
    ports:
      - "127.0.0.1:8429:8429"
    depends_on:
      victoriametrics:
        condition: service_started
    volumes:
      - ../vmagent/vmagent.yml:/etc/vmagent/vmagent.yml:ro
    command:
      - -promscrape.config=/etc/vmagent/vmagent.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
      - -httpListenAddr=:8429
      - -promscrape.suppressScrapeErrors
      - -remoteWrite.tmpDataPath=/tmp/vmagent-remotewrite-data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1:8429/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "homelab.config-hash=${MONITORING_CONFIG_HASH:-unset}"
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  # --- New: alert rules evaluation -> Alertmanager ---
  vmalert:
    image: victoriametrics/vmalert:v1.152.0
    restart: unless-stopped
    networks: [monitoring]
    depends_on:
      victoriametrics:
        condition: service_started
      alertmanager:
        condition: service_started
    # Localhost-bound UI for debugging.
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ../vmalert/rules:/etc/vmalert/rules:ro
    command:
      - -rule=/etc/vmalert/rules/*.yml
      - -datasource.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -httpListenAddr=:8880
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=3 http://127.0.0.1:8880/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "homelab.config-hash=${MONITORING_CONFIG_HASH:-unset}"
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  grafana:
    image: grafana/grafana:11.6.16
    restart: unless-stopped
    networks: [monitoring]
    ports:
      - "3000:3000"
    environment:
      # secrets in env_file (and keep it out of git)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Optional: enable Grafana's VictoriaMetrics metrics endpoint
      GF_METRICS_ENABLED: "true"
      # Disabling sending usage statistics to Grafana Labs
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ENABLE_GZIP: "true" # Better performance on Pi
      # Grafana plugin preinstall (pinned)
      # Prefer the newer env var over GF_INSTALL_PLUGINS
      GF_PLUGINS_PREINSTALL: >
        victoriametrics-logs-datasource@0.24.1
    volumes:
      - /srv/data/stacks/monitoring/grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    labels:
      - "homelab.config-hash=${MONITORING_CONFIG_HASH:-unset}"
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    # Grafana needs write access to /var/lib/grafana (volume), so not fully read-only
    tmpfs:
      - /tmp

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    restart: unless-stopped
    networks: [monitoring]
    # Do NOT expose to LAN; vmagent scrapes it via Docker network
    # ports:
    #   - "9100:9100"
    pid: host
    user: "65534:65534"
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|squashfs|sysfs|tracefs)$
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    # Root for the read-only host mounts; not privileged (F46 step 4, ADR-0011).
    user: root
    # F57: only DAC_OVERRIDE was used with cadvisor's own credentials in the cap_capable trace
    # of 2026-10-01 (ADR-0011, amendment 2026-10-01).
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    # F57: cadvisor execs only its own binary, and its image has no setuid/setgid or file-capability
    # files (measured 2026-10-01; ADR-0011, amendment "no-new-privileges").
    security_opt:
      - no-new-privileges=true
    # F57: `docker diff` over the container's life showed only the bind-mount targets, no writes of
    # its own, and its image declares no VOLUME (measured 2026-10-01; ADR-0011, amendment
    # "read_only"). No tmpfs: nothing was measured that needs one.
    read_only: true
    networks: [monitoring]
    # Do NOT expose to LAN; vmagent scrapes it via Docker network
    # ports:
    #   - "8080:8080"
    pid: host
    # F57: no /dev/kmsg. cadvisor read it only for its OOM watcher (container_oom_events_total),
    # which no rule or dashboard uses (measured 2026-10-02; ADR-0011, amendment "/dev/kmsg").
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro # Explicit cgroup v2 mount
      - /:/rootfs:ro
      # Read-only (F28): least privilege for the socket file. It does NOT restrict the Docker
      # API (F30): Docker API access remains host-root equivalent (ADR-0011).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command: # recommended flags for VictoriaMetrics integration + performance on Pi
      # Reduce CPU usage by checking containers less frequently essential for Pi resource management
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --event_storage_event_limit=0
      - --event_storage_age_limit=0
      # Prevents cAdvisor from trying to monitor the whole host, focusing only on containers
      - --docker_only=true
      # Enable filtering metrics in Grafana by the labels set in compose file
      - --store_container_labels=true
      # Added for Pi 5 / cgroup v2 handling:
      - --enable_load_reader=false
      - --allow_dynamic_housekeeping=true
      # Use this only if logs show "container not found in any cgroup"
      # - --cgroup_hierarchy_root=/sys/fs/cgroup # Forces cAdvisor to the correct Cgroup V2 root on Pi OS

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    # F7: without it VictoriaLogs stayed down after the reboot on 2026-09-29.
    restart: unless-stopped
    command:
      - --storageDataPath=/vlogs
      - --httpListenAddr=:9428
      # Guardrail: cap disk usage for logs (bytes)
      - --retention.maxDiskSpaceUsageBytes=50000000000 # ~50GB
    networks: [monitoring]
    ports:
      - "9428:9428" # LAN access; restricted by UFW rules
    deploy:
      resources:
        limits:
          memory: 2G
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    volumes:
      # Persistent log store (bind mount for deterministic backup/restore)
      - /srv/data/stacks/monitoring/victorialogs:/vlogs

  # Filtering Docker API proxy (F30, ADR-0012): the only service with the Docker socket and the
  # Docker group. GET only, on the paths vector's docker_logs source uses; clients by name only.
  # 127.0.0.1/32 lets postdeploy test_26 probe the allowlist from the proxy's own namespace.
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    user: "65534:65534"
    group_add:
      - "${DOCKER_GID}"
    networks: [docker-api]
    command:
      - -listenip=0.0.0.0
      - -allowfrom=vector,127.0.0.1/32
      - -allowGET=(/v1\.[0-9]+)?/(events|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|logs))
      - -allowhealthcheck
      - -shutdowngracetime=5
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  vector:
    image: timberio/vector:0.53.0-debian
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    # Own config hash over vector.yaml (deploy.sh, F1/F29): a config change recreates vector.
    labels:
      - "homelab.config-hash=${VECTOR_CONFIG_HASH:-unset}"
    # apps: on purpose (F34) - reserved for processing data from app services (apps stack, R6);
    # docker_logs does not use it. docker-api: Docker API through socket-proxy only (F30,
    # ADR-0012). Pinned in tests/guards/test_10.
    networks:
      - monitoring
      - apps
      - docker-api
    environment:
      - HOST_NODE_NAME=${HOSTNAME:-rpi-hub}
      - VECTOR_CONFIG=/etc/vector/vector.yaml
    depends_on:
      victorialogs:
        condition: service_started
      socket-proxy:
        condition: service_healthy
    # Needs journald access; see runbook notes below. No Docker group since F30.
    user: "65532:65532"
    group_add:
      - "${SYSTEMD_JOURNAL_GID}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges=true
    volumes:
      - /srv/data/stacks/monitoring/vector:/var/lib/vector
      - ../vector/vector.yaml:/etc/vector/vector.yaml:ro
      # journald access (runtime + persistent)
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro

networks:
  monitoring:
    external: true
    name: monitoring
  apps:
    external: true
    name: apps
  # Internal network, bootstrapped by scripts/network/bootstrap-networks.sh (R1.9).
  docker-api:
    external: true
    name: docker-api
