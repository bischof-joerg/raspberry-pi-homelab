# Persistent journal for the Pi (F62, R1.18).
#
# Installed to /etc/systemd/journald.conf.d/ by scripts/host/ensure-journald-persistent.sh,
# which deploy.sh runs. Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf with Storage=volatile to spare SD
# cards; this Pi boots from an NVMe SSD. journald applies the drop-ins of all directories in file
# name order and the last assignment wins, so this file must sort after that one.
#
# Checked by tests/guards/test_57_journald_persistent.py and
# tests/postdeploy/test_07_host_journald_persistent.py.

[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=4G
