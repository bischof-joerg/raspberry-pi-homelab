# Managed by raspberry-pi-homelab (F67) — installed by scripts/host/ensure-sshd-hardening.sh.
# The Pi is a deploy target only: no forwarding of any kind (no VS Code Remote-SSH, no tunnels),
# no root login (no root key exists), keys only.
#
# The global values alone are not enough: sshd_config's own `Match User admin` block sets
# AllowTcpForwarding and AllowAgentForwarding to yes, and a matching Match block overrides a global
# value. Of several matching Match blocks the first one wins, so the `Match all` below — read first
# through the Include at the top of sshd_config — decides for every user. OpenSSH ends a Match
# block at the end of an included file; it must stay the last block here. Measured with
# `sshd -T -C user=admin,...` on a copy of the Pi's configuration, OpenSSH 10.0p2, 2026-10-01.

AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
PermitRootLogin no
PasswordAuthentication no

Match all
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitRootLogin no
    PasswordAuthentication no
